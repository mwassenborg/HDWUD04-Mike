<!DOCTYPE html>

<head>
  <link rel="stylesheet" href="./CSS/stylesheet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
  <script src="https://kit.fontawesome.com/e766bcebc4.js" crossorigin="anonymous"></script>

  <style>
    #map { height: 60vw; }

    /* ── Control bar ── */
    #control-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #f4f4f4;
      border: 1px solid #ccc;
      border-top: none;
    }

    #control-bar button {
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    #time-slider { flex: 1; cursor: pointer; }

    #precip-label {
      font-size: 0.85rem;
      font-weight: bold;
      min-width: 110px;
      text-align: right;
    }

    /* ── Barchart ── */
    #chart-panel {
      display: none;
      padding: 8px 16px 12px;
      background: #f4f4f4;
      border: 1px solid #ccc;
      border-top: none;
    }

    #chart-panel h3 { font-size: 0.75rem; color: #666; margin-bottom: 5px; }

    #bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 50px;
      overflow-x: auto;
    }

    .bar-wrap { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex-shrink: 0; }
    .bar { width: 7px; min-height: 2px; border-radius: 2px 2px 0 0; opacity: 0.85; transition: opacity 0.15s; }
    .bar-wrap:hover .bar { opacity: 0.6; }
    .bar-wrap.active .bar { outline: 1.5px solid #333; opacity: 1; }

    /* ── Legenda ── */
    .rain-legend {
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.72rem;
      line-height: 1.8;
    }

    .rain-legend b { display: block; margin-bottom: 3px; font-size: 0.75rem; }

    .rain-legend-bar {
      width: 120px;
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(to right, #2196f3, #00e5ff, #4caf50, #ff9800, #f44336);
      margin: 4px 0 2px;
    }

    .rain-legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #666;
    }

    /* ── Tijdlabel ── */
    #map-time-label {
      background: rgba(255,255,255,0.92);
      padding: 4px 10px;
      border-radius: 3px;
      border: 1px solid #ccc;
      font-size: 0.78rem;
      font-weight: bold;
      pointer-events: none;
    }

    /* ── Laadmelding ── */
    #load-status {
      background: rgba(255,255,255,0.92);
      padding: 4px 10px;
      border-radius: 3px;
      border: 1px solid #ccc;
      font-size: 0.72rem;
      color: #555;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="top-container">
    <div id="topbar">
      <div class="topbar-inner">
        <span>Waterschap Limburg</span>
        <div class="topbar-rechts"></div>
      </div>
    </div>

    <div id="header">
      <h2>GeoJSON inladen</h2>
    </div>

    <div id="map"></div>

    <div id="control-bar">
      <button id="btn-prev">◀</button>
      <input type="range" id="time-slider" min="0" value="0"/>
      <button id="btn-next">▶</button>
      <span id="precip-label">— mm/u</span>
    </div>

    <div id="chart-panel">
      <h3>Gemiddelde neerslag Hekerbeekdal — 72 uur forecast (klik op een balk)</h3>
      <div id="bar-chart"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // KAART INITIALISATIE
    // =========================================================================

    const osm = L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png');

    const map = L.map('map', {
      center: [50.8740, 5.8560],
      zoom: 14,
      layers: [osm]
    });

    // ── KNMI Radar ────────────────────────────────────────────────────────────
    let radarLayer;

    function refreshRadar() {
      if (radarLayer) map.removeLayer(radarLayer);
      radarLayer = L.tileLayer.wms(
        'https://anonymous.api.dataplatform.knmi.nl/wms/adaguc-server?_ts=' + Date.now(), {
          layers:      'RAD_NL25_PCP_CM',
          DATASET:     'radar_5min_reflectivity_composites_realtime',
          format:      'image/png',
          transparent: true,
          version:     '1.3.0',
          opacity:     0.7
        }
      ).addTo(map);
    }

    refreshRadar();
    setInterval(refreshRadar, 60000);

    // ── FontAwesome marker ────────────────────────────────────────────────────
    const fontAwesomeIcon = L.divIcon({
      html: '<i class="fa-solid fa-location-dot"></i>',
      iconSize: [1, 1],
      className: 'fontawesome_icon'
    });

    // ── GeoJSON punt marker ───────────────────────────────────────────────────
    const geojson_marker = {
      "type": "FeatureCollection",
      "features": [{
        "type": "Feature",
        "geometry": { "type": "Point", "coordinates": [5.857151285045644, 50.87425546858122] },
        "properties": { "naam": "Hekerbeekdal", "adres": "6301 RJ Valkenburg" }
      }]
    };

    L.geoJson(geojson_marker, {
      onEachFeature: (feature, layer) =>
        layer.bindPopup('<b>' + feature.properties.naam + '</b>'),
      pointToLayer: (ftr, latlng) =>
        L.marker([latlng.lat, latlng.lng], { icon: fontAwesomeIcon })
    }).addTo(map);

    // ── GeoJSON grens Hekerbeekdal (jouw bestand) ────────────────────────────
    const HEKERBEEKDAL_GEOJSON = {"type":"FeatureCollection","crs":{"type":"name","properties":{"name":"EPSG:4326"}},"features":[{"type":"Feature","id":1,"geometry":{"type":"Polygon","coordinates":[[[5.83278695519504,50.8668136373307],[5.83628422071096,50.8699904758606],[5.84174412091222,50.8718512010068],[5.84475945250315,50.8732508714868],[5.85343609100665,50.8785856560635],[5.86089854092654,50.8818085052934],[5.86869306226526,50.8824511712116],[5.87187373211727,50.8818202696041],[5.87595804765992,50.879362710745],[5.87682212957731,50.8771780653809],[5.87719630033652,50.8751338227889],[5.87638715734708,50.8737942555048],[5.87087116092422,50.8706871481932],[5.8700109795242,50.8687075523679],[5.86658737202713,50.8668202086332],[5.86186775745818,50.8663813080579],[5.85552873950221,50.8667939789247],[5.84937347264218,50.8664164269788],[5.84353339355075,50.8663741352961],[5.83860617125017,50.8657086004643],[5.83713426019307,50.8648048429774],[5.83278695519504,50.8668136373307]]]},"properties":{"OBJECTID":1}}]};

    // Toon de polygoongrens op de kaart
    L.geoJson(HEKERBEEKDAL_GEOJSON, {
      style: {
        color: '#0066cc',
        weight: 2,
        fillOpacity: 0,
        dashArray: '5, 5'
      }
    }).addTo(map);


    // =========================================================================
    // NEERSLAG HEATMAP OVER HET HEKERBEEKDAL
    // =========================================================================

    // ── Stap 1: genereer een grid van punten binnen de polygoon ───────────────

    /**
     * Ray-casting algoritme: geeft true als [lon, lat] binnen de polygoon valt.
     */
    function pointInPolygon(lon, lat, polygon) {
      const coords = polygon[0]; // outer ring
      let inside = false;
      for (let i = 0, j = coords.length - 1; i < coords.length; j = i++) {
        const xi = coords[i][0], yi = coords[i][1];
        const xj = coords[j][0], yj = coords[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    /**
     * Genereert een grid van lat/lon punten binnen de polygoon.
     * @param {Array} polygon - GeoJSON polygon coordinates
     * @param {number} step   - stapgrootte in graden (~0.005° ≈ 400m)
     */
    function generateGridPoints(polygon, step = 0.006) {
      const coords = polygon[0];
      const lons = coords.map(c => c[0]);
      const lats = coords.map(c => c[1]);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);

      const points = [];
      for (let lat = minLat; lat <= maxLat; lat += step) {
        for (let lon = minLon; lon <= maxLon; lon += step) {
          if (pointInPolygon(lon, lat, polygon)) {
            points.push({ lat: +lat.toFixed(6), lon: +lon.toFixed(6) });
          }
        }
      }
      return points;
    }

    const polygonCoords = HEKERBEEKDAL_GEOJSON.features[0].geometry.coordinates;
    const gridPoints    = generateGridPoints(polygonCoords, 0.006);

    // ── Stap 2: haal voor elk punt de neerslag op ─────────────────────────────

    async function fetchPrecip(lat, lon) {
      const url =
        `https://api.open-meteo.com/v1/forecast` +
        `?latitude=${lat}&longitude=${lon}` +
        `&hourly=precipitation&models=knmi_seamless&forecast_days=3`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      return j.hourly; // { time: [...], precipitation: [...] }
    }

    // ── State ─────────────────────────────────────────────────────────────────
    let times        = [];
    let allPrecips   = []; // allPrecips[gridIndex][timeIndex] = mm
    let timeIndex    = 0;
    let heatLayer    = null;

    // ── Leaflet controls ──────────────────────────────────────────────────────
    const timeControl = L.control({ position: 'topleft' });
    timeControl.onAdd = function () {
      const div = L.DomUtil.create('div');
      div.id = 'map-time-label';
      div.textContent = 'Forecast laden…';
      return div;
    };
    timeControl.addTo(map);

    const statusControl = L.control({ position: 'bottomleft' });
    statusControl.onAdd = function () {
      const div = L.DomUtil.create('div');
      div.id = 'load-status';
      div.textContent = '';
      return div;
    };
    statusControl.addTo(map);

    const rainLegend = L.control({ position: 'bottomright' });
    rainLegend.onAdd = function () {
      const div = L.DomUtil.create('div', 'rain-legend');
      div.innerHTML = `
        <b>Neerslag (mm/u)</b>
        <div class="rain-legend-bar"></div>
        <div class="rain-legend-labels"><span>0</span><span>1</span><span>2</span><span>3</span><span>5+</span></div>
      `;
      return div;
    };

    // ── Helpers ───────────────────────────────────────────────────────────────
    function formatTime(iso) {
      return new Date(iso).toLocaleString('nl-NL', {
        weekday: 'short', day: 'numeric', month: 'short',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function avgPrecipAtTime(idx) {
      const vals = allPrecips.map(p => p[idx] ?? 0);
      return vals.reduce((a, b) => a + b, 0) / vals.length;
    }

    // ── Heatmap renderen ──────────────────────────────────────────────────────
    function renderFrame(idx) {
      timeIndex = idx;

      const avg = avgPrecipAtTime(idx);
      document.getElementById('map-time-label').textContent  = formatTime(times[idx]);
      document.getElementById('time-slider').value           = idx;
      document.getElementById('precip-label').textContent    = 'gem. ' + avg.toFixed(2) + ' mm/u';

      // Bouw heatmap data: [lat, lon, intensity]
      const heatData = gridPoints.map((pt, gi) => {
        const mm = allPrecips[gi][idx] ?? 0;
        return [pt.lat, pt.lon, mm];
      });

      if (heatLayer) map.removeLayer(heatLayer);

      heatLayer = L.heatLayer(heatData, {
        radius:   45,
        blur:     30,
        maxZoom:  16,
        max:      5,
        gradient: {
          0.0:  '#2196f3',
          0.05: '#00e5ff',
          0.3:  '#4caf50',
          0.65: '#ff9800',
          1.0:  '#f44336'
        }
      }).addTo(map);

      // Barchart highlight
      document.querySelectorAll('.bar-wrap').forEach((el, i) =>
        el.classList.toggle('active', i === idx)
      );
    }

    // ── Barchart ──────────────────────────────────────────────────────────────
    function buildChart() {
      const avgs  = times.map((_, i) => avgPrecipAtTime(i));
      const maxP  = Math.max(...avgs, 0.1);
      const container = document.getElementById('bar-chart');
      container.innerHTML = '';

      avgs.forEach((mm, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'bar-wrap';
        if (i === timeIndex) wrap.classList.add('active');

        // kleur op basis van waarde
        let color;
        if (mm <= 0)  color = '#2196f3';
        else if (mm < 0.5) color = '#00e5ff';
        else if (mm < 2)   color = '#4caf50';
        else if (mm < 5)   color = '#ff9800';
        else color = '#f44336';

        const bar = document.createElement('div');
        bar.className        = 'bar';
        bar.style.height     = Math.max(2, (mm / maxP) * 46) + 'px';
        bar.style.background = color;
        bar.title            = `${formatTime(times[i])}: ${mm.toFixed(2)} mm`;

        wrap.appendChild(bar);
        wrap.addEventListener('click', () => { renderFrame(i); buildChart(); });
        container.appendChild(wrap);
      });

      const active = container.querySelector('.active');
      if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
    }

    // ── Data laden ────────────────────────────────────────────────────────────
    async function loadRainData() {
      const statusEl = document.getElementById('load-status');
      statusEl.textContent = `0 / ${gridPoints.length} punten geladen…`;

      try {
        // Parallel alle punten ophalen
        let loaded = 0;
        const results = await Promise.all(
          gridPoints.map(pt =>
            fetchPrecip(pt.lat, pt.lon).then(data => {
              loaded++;
              statusEl.textContent = `${loaded} / ${gridPoints.length} punten geladen…`;
              return data;
            })
          )
        );

        // Tijdas uit eerste resultaat
        times      = results[0].time;
        allPrecips = results.map(r => r.precipitation);

        statusEl.textContent = `${gridPoints.length} punten geladen ✓`;
        setTimeout(() => statusEl.textContent = '', 3000);

        // UI tonen
        document.getElementById('control-bar').style.display = 'flex';
        document.getElementById('chart-panel').style.display = 'block';
        rainLegend.addTo(map);

        const slider = document.getElementById('time-slider');
        slider.max   = times.length - 1;
        slider.value = 0;

        buildChart();
        renderFrame(0);

      } catch (err) {
        console.error('Neerslag API fout:', err);
        document.getElementById('map-time-label').textContent = '❌ Forecast mislukt';
        statusEl.textContent = err.message;
      }
    }

    // ── Event listeners ───────────────────────────────────────────────────────
    document.getElementById('time-slider').addEventListener('input', (e) => {
      renderFrame(+e.target.value);
      buildChart();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (timeIndex > 0) { renderFrame(timeIndex - 1); buildChart(); }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (timeIndex < times.length - 1) { renderFrame(timeIndex + 1); buildChart(); }
    });

    // ── Start ─────────────────────────────────────────────────────────────────
    loadRainData();

  </script>
</body>
